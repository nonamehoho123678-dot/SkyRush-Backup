
name: Build Linux Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/build-linux.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite for Linux
        run: npm rebuild sqlite3

      - name: Verify dependencies
        run: |
          node -e "require('discord.js'); console.log('discord.js OK')"
          node -e "require('sqlite3'); console.log('sqlite3 OK')"

      - name: Upload Linux node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules-linux-node20
          path: node_modules/
          if-no-files-found: error
          retention-days: 3
